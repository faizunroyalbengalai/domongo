---
# Thin Ansible orchestrator for DigitalOcean Droplet.
# When registry is set ("ghcr" or "docr") the playbook installs Docker and
# pulls a pre-built container from that registry. Otherwise it installs the
# language runtime natively and runs the app under systemd/pm2.
- name: Deploy domongo
  hosts: all
  become: true
  gather_facts: yes
  vars:
    ansible_ssh_retries: 5
    app_dir: /opt/app
    app_port: 3000
    project: 'domongo'
    web_server: 'nginx'
    node_version: '20'

  tasks:
    # ── System update ──────────────────────────────────────────────────────────
    - name: Wait for SSH to be fully ready
      wait_for_connection:
        timeout: 120

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      retries: 3
      delay: 10
      register: _apt_update
      until: _apt_update is succeeded

    # ── Node.js runtime ───────────────────────────────────────────────────────
    - name: Install Node.js {{ node_version }}
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ node_version }}.x | bash -
        apt-get install -y nodejs
      args:
        executable: /bin/bash

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes

    # ── Local database installation ───────────────────────────────────────────
    - name: Add MongoDB GPG key
      shell: |
        curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc | \
          gpg --dearmor -o /usr/share/keyrings/mongodb-server-7.0.gpg
      args:
        executable: /bin/bash
        creates: /usr/share/keyrings/mongodb-server-7.0.gpg

    - name: Add MongoDB repository
      copy:
        dest: /etc/apt/sources.list.d/mongodb-org-7.0.list
        content: |
          deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse

    - name: Install MongoDB
      apt:
        name: mongodb-org
        state: present
        update_cache: yes

    - name: Ensure MongoDB is started
      systemd:
        name: mongod
        state: started
        enabled: yes

    - name: Wait for MongoDB to be ready
      wait_for:
        port: 27017
        host: 127.0.0.1
        timeout: 60

    - name: Create MongoDB database and user
      shell: |
        DB_NAME="{{ deploy_db_name | default(project | replace('-', '_') + 'db', true) }}"
        DB_USER="{{ deploy_db_username | default('', true) }}"
        DB_PASS="{{ deploy_db_password | default('', true) }}"
        if [ -n "$DB_USER" ] && [ -n "$DB_PASS" ]; then
          mongosh "$DB_NAME" --eval "
            try { db.createUser({ user: '$DB_USER', pwd: '$DB_PASS', roles: [{ role: 'readWrite', db: '$DB_NAME' }] }) }
            catch(e) { db.updateUser('$DB_USER', { pwd: '$DB_PASS', roles: [{ role: 'readWrite', db: '$DB_NAME' }] }) }
          " || true
        fi
      args:
        executable: /bin/bash


    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Configure Nginx reverse proxy
      copy:
        dest: /etc/nginx/sites-available/app
        content: |
          server {
            listen 80;
            server_name _;
            location / {
              proxy_pass http://127.0.0.1:{{ app_port }};
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_read_timeout 120s;
            }
          }

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/app
        dest: /etc/nginx/sites-enabled/app
        state: link

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent


    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Copy application files
      copy:
        src: ../
        dest: "{{ app_dir }}/"
        mode: preserve
      notify: Restart app

    - name: Install Node dependencies
      npm:
        path: "{{ app_dir }}"
        production: yes
    - name: Create .env file
      shell: |
        printf '' > {{ app_dir }}/.env
        DB_URL="{{ deploy_database_url | default('', true) }}"
        [ -n "$DB_URL" ] && printf 'DATABASE_URL=%s\n' "$DB_URL" >> {{ app_dir }}/.env || true
        printf 'PORT={{ app_port }}\nNODE_ENV=production\n' >> {{ app_dir }}/.env
      args:
        executable: /bin/bash

    - name: Start app with PM2
      shell: |
        cd {{ app_dir }}
        pm2 delete app 2>/dev/null || true
        pm2 start server.js --name app --update-env
        pm2 save
        pm2 startup systemd -u root --hp /root | tail -1 | bash || true
      args:
        executable: /bin/bash

    - name: Reload and start web server
      service:
        name: "{{ 'apache2' if (web_server or 'nginx').lower() == 'apache' else 'nginx' }}"
        state: reloaded
        enabled: yes

  handlers:
    - name: Restart app
      shell: |
        cd {{ app_dir }} && pm2 restart app --update-env 2>/dev/null || true
      args:
        executable: /bin/bash
